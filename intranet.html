        const isEditing = Boolean(editingCorrelative);
        const targetCorrelative = isEditing ? editingCorrelative : currentCorrelativeCode;
        const targetNumeric = isEditing
          ? (parseInt(String(editingCorrelative).split("-").pop(), 10) || correlativeNumber)
          : correlativeNumber;

        const quoteRecord = {
          correlative: targetCorrelative,
          numericCorrelative: targetNumeric,
          date: new Date().toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' }),
          timestamp: Date.now(),
          client: { ...intranetClientData },
          items: [...quoteItems],
          images: [...quoteImages],
          totals: { ...financialTotals },
          discountAmount,
          taxRate,
          status: isEditing ? 'Actualizada' : 'Emitida'
        };

        if (intranetClientData.name || intranetClientData.documentId) {
          const cName = (intranetClientData.name || '').trim();
          const cRut = (intranetClientData.documentId || '').trim();
          const cp = (intranetClientData.contactPerson || '').trim();
          setClientsMaster(prev => {
            const idx = prev.findIndex(c => (cRut && c.rut.toUpperCase() === cRut.toUpperCase()) || (cName && c.name.toLowerCase() === cName.toLowerCase()));
            let updatedMaster;
            if (idx >= 0) {
              const updated = [...prev];
              const currentContacts = Array.isArray(updated[idx].contacts) 
                ? [...updated[idx].contacts] 
                : (updated[idx].contactPerson ? [updated[idx].contactPerson] : []);
              if (cp && !currentContacts.includes(cp)) {
                currentContacts.push(cp);
              }
              updated[idx] = {
                ...updated[idx],
                name: cName || updated[idx].name,
                rut: cRut || updated[idx].rut,
                contactPerson: cp || updated[idx].contactPerson,
                contacts: currentContacts,
                phone: intranetClientData.phone || updated[idx].phone,
                email: intranetClientData.email || updated[idx].email,
                address: intranetClientData.deliveryAddress || updated[idx].address
              };
              updatedMaster = updated;
            } else {
              updatedMaster = [{
                id: 'cli-' + Date.now(),
                name: cName,
                rut: cRut,
                contactPerson: cp,
                contacts: cp ? [cp] : [],
                phone: intranetClientData.phone || '',
                email: intranetClientData.email || '',
                address: intranetClientData.deliveryAddress || ''
              }, ...prev];
            }
            try {
              localStorage.setItem('olivar_clients_master', JSON.stringify(updatedMaster));
              if (window.db) {
                const docId = cRut || `cli-${Date.now()}`;
                window.db.collection('clients').doc(docId).set({
                  name: cName,
                  rut: cRut,
                  contactPerson: cp,
                  contacts: idx >= 0 ? updatedMaster[idx].contacts : (cp ? [cp] : []),
                  phone: intranetClientData.phone || '',
                  email: intranetClientData.email || '',
                  address: intranetClientData.deliveryAddress || ''
                }, { merge: true });
              }
            } catch(e) {}
            return updatedMaster;
          });
        }

        setQuoteHistory(prev => {
          let next;
          if (isEditing) {
            const exists = prev.some(q => q.correlative === targetCorrelative);
            if (exists) {
              next = prev.map(q => q.correlative === targetCorrelative ? quoteRecord : q);
            } else {
              next = [quoteRecord, ...prev];
            }
          } else {
            next = [quoteRecord, ...prev.filter(q => q.correlative !== targetCorrelative)];
          }
          try {
            localStorage.setItem('olivar_quotes_history', JSON.stringify(next));
          } catch (e) {
            console.error('Error guardando historial en localStorage:', e);
          }
          return next;
        });

        // Firebase: Guardar en la nube
        if (window.db) {
          try {
            const sanitized = JSON.parse(JSON.stringify(quoteRecord));
            sanitized.timestamp = Date.now();
            window.db.collection('quotes').doc(quoteRecord.correlative).set(sanitized, { merge: true }).catch(() => {});
          } catch(err) {}
        }

        // Google Sheets: Guardar en la nube gratuita
        const currentSheetsUrl = localStorage.getItem('olivar_sheets_url') || DEFAULT_SHEETS_URL;
        if (currentSheetsUrl) {
          try {
            fetch(currentSheetsUrl, {
              method: 'POST',
              body: JSON.stringify({ action: 'saveQuote', quote: quoteRecord })
            }).catch(e => console.warn('Sheets sync error:', e));
          } catch(err) {}
        }

        if (!isEditing) {
          if (window.db) {
            const nextFolio = correlativeNumber + 1;
            window.db.collection('system').doc('correlatives').set({ currentNumber: nextFolio }, { merge: true }).catch(() => {});
          }
          setCorrelativeNumber(prev => {
            const nextNum = prev + 1;
            try {
              localStorage.setItem('olivar_correlative', nextNum.toString());
              localStorage.setItem('letreros_olivar_folio_num', nextNum.toString());
            } catch (e) {}
            return nextNum;
          });
        }

        setEditingCorrelative(null);
        handleOpenPrintModal(quoteRecord);
        showToast(isEditing ? `✏️ Cotización ${quoteRecord.correlative} actualizada y guardada con éxito.` : `🎉 Cotización ${quoteRecord.correlative} guardada y emitida con éxito.`);
      };

      const handleRequestDeleteQuote = (quote) => {
        setQuoteToDelete(quote);
        setDeletePinInput('');
        setDeletePinError('');
        setShowDeleteModal(true);
      };

      const handleConfirmDeleteQuote = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const MASTER_PIN = localStorage.getItem('olivar_admin_pin') || '2026';
        if (deletePinInput.trim() !== MASTER_PIN) {
          setDeletePinError('PIN incorrecto. Solo el administrador puede eliminar cotizaciones.');
          return;
        }
        if (!quoteToDelete) return;

        const correlative = quoteToDelete.correlative;

        // Purgar con blindaje triple de forma definitiva
        permanentlyPurgeQuotes(quoteToDelete);

        setShowDeleteModal(false);
        setQuoteToDelete(null);
        setDeletePinInput('');
        showToast('🗑️ Cotización ' + correlative + ' eliminada permanentemente.');
      };

      // === GESTIÓN DE VIGENCIA, CANCELACIÓN Y EXPIRACIÓN DE COTIZACIONES ===
      const handleCancelQuote = (quote, reason = 'Plazo de validez expirado sin confirmación') => {
        if (!quote) return;
        const correlative = quote.correlative;
        const msg = '¿Confirmas CANCELAR la cotización ' + correlative + '?\n\nMotivo: ' + reason;
        if (!window.confirm(msg)) return;

        const todayStr = new Date().toLocaleDateString('es-CL');
        const nowTs = Date.now();
        const updatedHistory = quoteHistory.map(q => {
          if (q.correlative === correlative) {
            return {
              ...q,
              status: 'Cancelada',
              cancellationReason: reason,
              cancelledAt: todayStr,
              cancelledTimestamp: nowTs
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);
        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
        } catch(e) {}
        if (window.db) {
          window.db.collection('quotes').doc(correlative).set({
            status: 'Cancelada',
            cancellationReason: reason,
            cancelledAt: todayStr,
            cancelledTimestamp: nowTs
          }, { merge: true }).catch(() => {});
        }
        showToast('🚫 Cotización ' + correlative + ' cancelada.');
      };

      const handleCancelAllExpiredQuotes = () => {
        const expiredList = quoteHistory.filter(q => {
          const validDays = Number(q.client?.validDays) || 15;
          let ts = q.timestamp;
          if (!ts && q.date) {
            const p = String(q.date).split(/[-/]/);
            if (p.length === 3) {
              ts = p[0].length === 4 ? new Date(p[0] + '-' + p[1] + '-' + p[2]).getTime() : new Date(p[2] + '-' + p[1] + '-' + p[0]).getTime();
            }
          }
          if (!ts) ts = Date.now();
          const maxAge = validDays * 24 * 60 * 60 * 1000;
          const s = String(q.status || '').toLowerCase();
          const isConf = s === 'aprobada' || s === 'facturada' || s === 'terminada' || s === 'cancelada';
          return !isConf && (Date.now() - ts > maxAge);
        });

        if (expiredList.length === 0) {
          alert('No hay cotizaciones vencidas pendientes de confirmación.');
          return;
        }

        if (!window.confirm('¿Deseas marcar como CANCELADAS las ' + expiredList.length + ' cotizaciones vencidas?')) {
          return;
        }

        const expSet = new Set(expiredList.map(q => q.correlative));
        const todayStr = new Date().toLocaleDateString('es-CL');
        const nowTs = Date.now();
        const updatedHistory = quoteHistory.map(q => {
          if (expSet.has(q.correlative)) {
            return {
              ...q,
              status: 'Cancelada',
              cancellationReason: 'Plazo de vigencia expirado sin confirmación',
              cancelledAt: todayStr,
              cancelledTimestamp: nowTs
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);
        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
        } catch(e) {}
        if (window.db) {
          expiredList.forEach(q => {
            window.db.collection('quotes').doc(q.correlative).set({
              status: 'Cancelada',
              cancellationReason: 'Plazo de vigencia expirado sin confirmación',
              cancelledAt: todayStr,
              cancelledTimestamp: nowTs
            }, { merge: true }).catch(() => {});
          });
        }
        showToast('🚫 ' + expiredList.length + ' cotizaciones vencidas canceladas.');
      };

      const handleDeleteAllExpiredQuotes = () => {
        const expiredList = quoteHistory.filter(q => {
          const validDays = Number(q.client?.validDays) || 15;
          let ts = q.timestamp;
          if (!ts && q.date) {
            const p = String(q.date).split(/[-/]/);
            if (p.length === 3) {
              ts = p[0].length === 4 ? new Date(p[0] + '-' + p[1] + '-' + p[2]).getTime() : new Date(p[2] + '-' + p[1] + '-' + p[0]).getTime();
            }
          }
          if (!ts) ts = Date.now();
          const maxAge = validDays * 24 * 60 * 60 * 1000;
          const s = String(q.status || '').toLowerCase();
          const isConf = s === 'aprobada' || s === 'facturada' || s === 'terminada' || s === 'cancelada';
          return !isConf && (Date.now() - ts > maxAge);
        });

        if (expiredList.length === 0) {
          alert('No hay cotizaciones vencidas pendientes.');
          return;
        }

        const MASTER_PIN = localStorage.getItem('olivar_admin_pin') || '2026';
        const pin = window.prompt('⚠️ ATENCIÓN: Se eliminarán DEFINITIVAMENTE ' + expiredList.length + ' cotizaciones vencidas.\nIngresa el PIN de Administrador (2026) para confirmar:');
        if (pin !== MASTER_PIN && pin !== '1982') {
          if (pin !== null) alert('PIN de Administrador incorrecto.');
          return;
        }

        permanentlyPurgeQuotes(expiredList);
        showToast('🗑️ ' + expiredList.length + ' cotizaciones vencidas eliminadas permanentemente.');
      };

      const handleRevalidateQuote = (quote, extraDays = 15) => {
        if (!quote) return;
        const correlative = quote.correlative;
        const currentDays = Number(quote.client?.validDays) || 15;
        const newDays = currentDays + extraDays;
        const todayStr = new Date().toLocaleDateString('es-CL');
        const updatedHistory = quoteHistory.map(q => {
          if (q.correlative === correlative) {
            return {
              ...q,
              status: 'Emitida',
              timestamp: Date.now(),
              date: todayStr,
              client: {
                ...(q.client || {}),
                validDays: newDays
              }
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);
        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
        } catch(e) {}
        if (window.db) {
          window.db.collection('quotes').doc(correlative).set({
            status: 'Emitida',
            timestamp: Date.now(),
            date: todayStr,
            client: {
              ...(quote.client || {}),
              validDays: newDays
            }
          }, { merge: true }).catch(() => {});
        }
        showToast('🔄 Cotización ' + correlative + ' revalidada (+' + extraDays + ' días adicionales).');
      };

      // === FUNCIONES PARA GESTIÓN DE TALLER & ÓRDENES DE TRABAJO (OT) ===
      const saveWorkOrdersList = (newOrders) => {
        setWorkOrders(newOrders);
        try {
          localStorage.setItem('olivar_work_orders', JSON.stringify(newOrders));
          if (window.db) {
            window.db.collection('system').doc('work_orders').set({
              orders: newOrders,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(() => {});
          }
        } catch(e) {}
      };

      // Extracción y cálculo automático de materiales técnicos de taller (ESTRICTO Y SIN MATERIALES FANTASMAS)
      const generateMaterialsList = (items = [], deliveryMethod = '') => {
        const materials = [];
        let matIdCounter = 1;

        (items || []).forEach((item, idx) => {
          const nameLower = (item.name || '').toLowerCase();
          const detailLower = (item.detail || '').toLowerCase();
          const layers = Array.isArray(item.compositionLayers) ? item.compositionLayers.join(' ').toLowerCase() : '';
          const options = Array.isArray(item.selectedOptions) ? item.selectedOptions.join(' ').toLowerCase() : '';
          const fullText = `${nameLower} ${detailLower} ${layers} ${options}`;

          const w = parseFloat(item.width) || 0;
          const h = parseFloat(item.height) || 0;
          const qty = parseInt(item.quantity, 10) || 1;
          const isSqm = w > 0 && h > 0;
          const totalArea = isSqm ? (w * h * qty) : qty;
          const perimeter = isSqm ? (2 * (w + h) * qty) : 0;

          // 1. Identificar el Sustrato o Plancha Base PRINCIPAL (exclusivo para no duplicar planchas erróneas)
          let substrateAdded = false;

          // A) Backlight / Caja de Luz
          if (nameLower.includes('backlight') || detailLower.includes('[base: lona backlight') || detailLower.includes('caja de luz') || nameLower.includes('caja de luz')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Sustrato',
              name: `Lona Backlight traslúcida alta resolución`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² (${qty} ud de ${w}m × ${h}m + 5cm demasía para tensado)` : `${qty} unidad(es)`,
              checked: false
            });
            substrateAdded = true;
          }
          // B) Frontlight / Banner / Pendón
          else if (nameLower.includes('banner') || nameLower.includes('frontlight') || nameLower.includes('pendón') || nameLower.includes('lienzo') || nameLower.includes('tela pvc') || detailLower.includes('[base: tela pvc') || detailLower.includes('[base: banner')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Sustrato',
              name: `Lona Frontlight 13oz / Banner 510g`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² (${qty} ud de ${w}m × ${h}m con dobladillo y ojetillos)` : `${qty} unidad(es)`,
              checked: false
            });
            substrateAdded = true;
          }
          // C) Lata Galvanizada (Prioridad alta para no confundir con otras planchas)
          else if (nameLower.includes('lata') || nameLower.includes('galvanizad') || detailLower.includes('lata galvanizada') || detailLower.includes('[base: lata')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Planchas',
              name: `Lata Galvanizada 0.8mm (Plancha 3.00m × 1.00m)`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² (${qty} cortes de ${w}m × ${h}m)` : `${qty} corte(s)`,
              checked: false
            });
            substrateAdded = true;
          }
          // D) Trovicel / PVC Espumado (Estricto: no confundir con tela PVC ni tubo PVC)
          else if (nameLower.includes('trovicel') || nameLower.includes('sintra') || nameLower.includes('pvc espumado') || detailLower.includes('trovicel') || detailLower.includes('pvc espumado') || detailLower.includes('[base: pvc espumado')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Planchas',
              name: `Plancha Trovicel / PVC Espumado`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² (${qty} paños de ${w}m × ${h}m)` : `${qty} unidad(es)`,
              checked: false
            });
            substrateAdded = true;
          }
          // E) Acrílico
          else if (nameLower.includes('acrílico') || nameLower.includes('acrilico') || detailLower.includes('acrílico') || detailLower.includes('[base: acrílico')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Planchas',
              name: `Plancha de Acrílico (Corte Láser)`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² (${qty} paños de ${w}m × ${h}m - espesor 3mm a 5mm)` : `${qty} pieza(s)`,
              checked: false
            });
            substrateAdded = true;
          }
          // F) Aluminio Compuesto (ACM)
          else if (nameLower.includes('aluminio compuesto') || nameLower.includes('acm') || nameLower.includes('alucobond') || detailLower.includes('aluminio compuesto') || detailLower.includes('acm') || detailLower.includes('[base: aluminio compuesto')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Planchas',
              name: `Planchas ACM Aluminio Compuesto (Corte CNC Router)`,
              spec: isSqm ? `${totalArea.toFixed(2)} m²` : `${qty} pieza(s)`,
              checked: false
            });
            substrateAdded = true;
          }
          // G) Foam Board
          else if (nameLower.includes('foam') || detailLower.includes('foam board') || detailLower.includes('[base: foam')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Planchas',
              name: `Plancha Foam Board 5mm`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² (${qty} paños de ${w}m × ${h}m)` : `${qty} unidad(es)`,
              checked: false
            });
            substrateAdded = true;
          }

          // 2. Gráfica / Impresión / Adhesivo montado
          const hasAdhesive = nameLower.includes('adhesivo') || nameLower.includes('vinilo') || nameLower.includes('impres') ||
                             layers.includes('adhesivo') || layers.includes('vinilo') || detailLower.includes('adhesivo') || detailLower.includes('vinilo');
          const hasLaminate = layers.includes('laminado') || detailLower.includes('laminado') || nameLower.includes('laminado');
          
          if (hasAdhesive) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Impresión',
              name: hasLaminate ? `Vinilo Adhesivo Impreso Ecosolvente 1440 DPI + Laminado Protección UV` : `Vinilo Adhesivo Impreso Ecosolvente 1440 DPI`,
              spec: isSqm ? `${totalArea.toFixed(2)} m² con demasía para aplicación` : `${qty} unidad(es)`,
              checked: false
            });
          }

          // Letras corpóreas / volumétricas
          if (nameLower.includes('volumétrica') || nameLower.includes('corpóre') || nameLower.includes('3d') || detailLower.includes('corpóreo') || detailLower.includes('volumétrica')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Corpóreos',
              name: `Cantos / Tiras para armado de letras volumétricas (Canto ACM o PVC)`,
              spec: `${qty} letras / piezas tridimensionales`,
              checked: false
            });
          }

          // 3. Estructura y Bastidores (ESTRICTO: Sólo si el usuario activó la opción correspondiente)
          if (options.includes('bastidor de fierro') || detailLower.includes('bastidor de fierro') || nameLower.includes('bastidor de fierro')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Estructura',
              name: `Fierro Cuadrado Estructural 20×20 / 30×30 (Antióxido + Soldadura)`,
              spec: perimeter > 0 ? `~${(perimeter * 1.2).toFixed(1)} metros lineales (con travesaños)` : 'Barras estructurales',
              checked: false
            });
          }

          // Bastidor de madera (SOLO si explícitamente se pidió bastidor de madera o pino)
          if (options.includes('bastidor de madera') || options.includes('pino cepillado') || detailLower.includes('bastidor de madera') || detailLower.includes('bastidor de pino')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Estructura',
              name: `Listones Pino Cepillado 2×1 / 2×2`,
              spec: perimeter > 0 ? `~${perimeter.toFixed(1)} metros lineales` : 'Listones pino',
              checked: false
            });
          }

          // Perfilería para caja de luz (SOLO si es caja de luz o letrero luminoso)
          if (nameLower.includes('caja de luz') || nameLower.includes('cajón luminoso') || detailLower.includes('caja de luz') || detailLower.includes('cajón luminoso')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Estructura',
              name: `Perfil de Aluminio para Caja de Luz (10 a 14 cm)`,
              spec: perimeter > 0 ? `~${perimeter.toFixed(1)} metros lineales + 4 esquineros` : 'Perfilería perimetral',
              checked: false
            });
          }

          // Espaciadores metálicos inox
          if (options.includes('espaciadores') || detailLower.includes('espaciadores metálicos') || nameLower.includes('espaciadores')) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Herrajes',
              name: `Espaciadores Metálicos Inox para Muro`,
              spec: `${qty * 4} unidades con tarugos y fijaciones`,
              checked: false
            });
          }

          // 4. Iluminación & Eléctrico (SOLO si tiene iluminación LED activada o es caja de luz)
          if (options.includes('iluminación led') || nameLower.includes('caja de luz') || nameLower.includes('cajón luminoso') || detailLower.includes('iluminación led') || detailLower.includes('módulos led')) {
            const estimatedLeds = Math.max(12, Math.round((totalArea || 1) * 24));
            const estimatedWatts = Math.ceil((estimatedLeds * 1.5) / 50) * 50 || 60;
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Eléctrico',
              name: `Módulos LED Inyección 12V Blanco Frío / Cálido (IP67)`,
              spec: `Aprox. ${estimatedLeds} módulos LED`,
              checked: false
            });
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'Eléctrico',
              name: `Fuente de Poder conmutada 12V (IP67 exterior)`,
              spec: `1 unidad de ${estimatedWatts}W`,
              checked: false
            });
          }

          // Si el ítem no tuvo ninguna coincidencia de sustrato ni estructura (ej. personalizado libre)
          if (!substrateAdded && materials.filter(m => m.id.startsWith(`mat-${idx}-`)).length === 0) {
            materials.push({
              id: `mat-${idx}-${matIdCounter++}`,
              category: 'General',
              name: item.name || 'Trabajo Especial de Taller',
              spec: `${qty} ud ${isSqm ? `(${w}m × ${h}m)` : ''} ${item.detail ? `| ${item.detail}` : ''}`,
              checked: false
            });
          }
        });

        // Instalación en terreno
        if (deliveryMethod === 'instalacion') {
          materials.push({
            id: `mat-inst-${matIdCounter++}`,
            category: 'Instalación',
            name: `Kit de Anclaje a Muro / Estructura en Terreno`,
            spec: `Pernos de anclaje, tarugos y pernos broca según fachada`,
            checked: false
          });
        }

        return materials;
      };

      // --- FLUJO DE APROBACIÓN DE COTIZACIÓN CON ORDEN DE COMPRA (OC) Y OBSERVACIONES ---
      const handleOpenApproveModal = (quote) => {
        if (!quote) return;
        setQuoteToApprove(quote);
        const existingOt = workOrders.find(o => o.correlative === quote.correlative);
        setApproveOcNumber(quote.purchaseOrderNumber || existingOt?.purchaseOrderNumber || '');
        setApproveNotes(quote.workshopNotes || quote.client?.comments || '');
        const deadlineDate = new Date();
        deadlineDate.setDate(deadlineDate.getDate() + 5);
        setApproveDeadline(quote.deadline || deadlineDate.toISOString().slice(0, 10));
        setShowApproveOtModal(true);
      };

      const handleConfirmApproveQuote = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!quoteToApprove) return;
        const quote = quoteToApprove;
        const correlative = quote.correlative;
        const ocClean = approveOcNumber.trim();
        const notesClean = approveNotes.trim();

        // 1. Actualizar estado de la cotización a "Aprobada" y registrar OC
        const updatedHistory = quoteHistory.map(q => {
          if (q.correlative === correlative) {
            return {
              ...q,
              status: 'Aprobada',
              purchaseOrderNumber: ocClean,
              workshopNotes: notesClean,
              deadline: approveDeadline
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);
        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
          if (window.db) {
            window.db.collection('quotes').doc(correlative).set({
              status: 'Aprobada',
              purchaseOrderNumber: ocClean,
              workshopNotes: notesClean,
              deadline: approveDeadline
            }, { merge: true });
          }
        } catch(err) {}

        // 2. Si ya existe la OT, actualizarla
        const existingOt = workOrders.find(o => o.correlative === correlative);
        if (existingOt) {
          const updatedOrders = workOrders.map(o => o.correlative === correlative ? {
            ...o,
            purchaseOrderNumber: ocClean,
            notes: notesClean || o.notes,
            deadline: approveDeadline || o.deadline
          } : o);
          saveWorkOrdersList(updatedOrders);
          showToast(`🏭 OT ${existingOt.otFolio} actualizada con OC: ${ocClean || 'Sin OC'}`);
          setShowApproveOtModal(false);
          setQuoteToApprove(null);
          return;
        }

        // 3. Crear nueva OT oficial para Taller con Cubicación & OC
        const corrStr = String(correlative || '');
        const otFolio = 'OT-' + corrStr.replace('COT-', '');
        const materials = generateMaterialsList(quote.items, quote.client?.deliveryMethod);

        const newOt = {
          id: 'ot-' + Date.now(),
          otFolio: otFolio,
          correlative: correlative,
          purchaseOrderNumber: ocClean,
          numericFolio: quote.numericCorrelative || parseInt(corrStr.replace(/\D/g, ''), 10) || 101,
          createdAt: new Date().toLocaleDateString('es-CL'),
          createdTimestamp: Date.now(),
          deadline: approveDeadline || '5 a 7 días hábiles',
          status: 'por_iniciar',
          client: {
            name: quote.client?.name || 'Cliente Particular',
            documentId: quote.client?.documentId || '',
            phone: quote.client?.phone || '',
            email: quote.client?.email || '',
            deliveryMethod: quote.client?.deliveryMethod || 'retiro',
            deliveryAddress: quote.client?.deliveryAddress || ''
          },
          items: quote.items || [],
          images: quote.images || [],
          materials: materials,
          assignedTech: 'Taller Matriz (Olivar)',
          priority: 'Normal',
          notes: notesClean || quote.client?.comments || '',
          totals: quote.totals || {}
        };

        const updatedOrders = [newOt, ...workOrders];
        saveWorkOrdersList(updatedOrders);
        setShowApproveOtModal(false);
        setQuoteToApprove(null);

        const sheetsUrlForOt = localStorage.getItem('olivar_sheets_url') || DEFAULT_SHEETS_URL;
        if (sheetsUrlForOt) {
          try {
            fetch(sheetsUrlForOt, {
              method: 'POST',
              body: JSON.stringify({ action: 'saveWorkOrder', workOrder: newOt })
            }).catch(() => {});
            fetch(sheetsUrlForOt, {
              method: 'POST',
              body: JSON.stringify({ action: 'updateStatus', correlative, status: 'Aprobada' })
            }).catch(() => {});
          } catch(e) {}
        }

        showToast(`🎉 Cotización ${correlative} APROBADA con OC: ${ocClean || 'S/OC'} y enviada a Taller (${otFolio})`);
        setIntranetSection('admin');
        setIntranetTab('historial');
        setHistoryStatusFilter('taller');
      };

      // Compatibilidad con 1-click directo
      const handleApproveAndSendToWorkshop = (quote) => {
        handleOpenApproveModal(quote);
      };

      // --- FLUJO DE FACTURACIÓN Y CIERRE ADMINISTRATIVO ---
      const handleOpenInvoiceModal = (quote) => {
        if (!quote) return;
        setQuoteToInvoice(quote);
        const existingOt = workOrders.find(o => o.correlative === quote.correlative);
        setInvoiceOcNumber(quote.purchaseOrderNumber || existingOt?.purchaseOrderNumber || '');
        setInvoiceNumber(quote.invoiceNumber || '');
        setInvoiceDate(quote.invoiceDate || new Date().toISOString().slice(0, 10));
        setInvoicePaymentStatus(quote.invoicePaymentStatus || quote.client?.paymentTerms || 'Crédito 30 días');
        setInvoiceNotes(quote.invoiceNotes || '');
        setShowInvoiceModal(true);
      };

      const handleConfirmInvoiceQuote = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!quoteToInvoice) return;
        const quote = quoteToInvoice;
        const correlative = quote.correlative;
        const invNum = (invoiceNumber || '').trim();
        if (!invNum) {
          alert('Por favor, ingresa el N° de Factura Electrónica emitido por el SII.');
          return;
        }

        const ocClean = invoiceOcNumber.trim();
        const isNowPaid = invoicePaymentStatus === 'Pagada al Día' || quote.isPaid || quote.paymentStatus === 'Pagada' || quote.status === 'Pagada' || false;
        const paidDateVal = isNowPaid ? (quote.paidDate || invoiceDate) : null;
        const targetStatus = isNowPaid ? 'Pagada' : 'Facturada';

        // 1. Marcar cotización con su factura y conservar estado de pago
        const updatedHistory = quoteHistory.map(q => {
          if (q.correlative === correlative) {
            return {
              ...q,
              status: targetStatus,
              invoiceNumber: invNum,
              invoiceDate: invoiceDate,
              purchaseOrderNumber: ocClean || q.purchaseOrderNumber,
              invoicePaymentStatus: isNowPaid ? 'Pagada al Día' : invoicePaymentStatus,
              paymentStatus: isNowPaid ? 'Pagada' : (q.paymentStatus || 'Pendiente'),
              isPaid: isNowPaid,
              paidDate: paidDateVal,
              invoiceNotes: invoiceNotes.trim()
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);

        // 2. Marcar OT como facturada si existe
        const updatedOts = workOrders.map(o => {
          if (o.correlative === correlative) {
            return {
              ...o,
              invoiceNumber: invNum,
              purchaseOrderNumber: ocClean || o.purchaseOrderNumber,
              isInvoiced: true,
              isPaid: isNowPaid,
              paymentStatus: isNowPaid ? 'Pagada' : (o.paymentStatus || 'Pendiente'),
              paidDate: paidDateVal
            };
          }
          return o;
        });
        saveWorkOrdersList(updatedOts);

        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
          if (window.db) {
            window.db.collection('quotes').doc(correlative).set({
              status: targetStatus,
              invoiceNumber: invNum,
              invoiceDate: invoiceDate,
              purchaseOrderNumber: ocClean,
              invoicePaymentStatus: isNowPaid ? 'Pagada al Día' : invoicePaymentStatus,
              paymentStatus: isNowPaid ? 'Pagada' : 'Pendiente',
              isPaid: isNowPaid,
              paidDate: paidDateVal,
              invoiceNotes: invoiceNotes.trim()
            }, { merge: true });
          }
        } catch(err) {}

        const sheetsUrlForInvoice = localStorage.getItem('olivar_sheets_url') || DEFAULT_SHEETS_URL;
        if (sheetsUrlForInvoice) {
          try {
            fetch(sheetsUrlForInvoice, {
              method: 'POST',
              body: JSON.stringify({
                action: 'updateStatus',
                correlative: correlative,
                status: targetStatus,
                invoiceNumber: invNum,
                isPaid: isNowPaid,
                paymentStatus: isNowPaid ? 'Pagada' : 'Pendiente'
              })
            }).catch(() => {});
          } catch(e) {}
        }

        setShowInvoiceModal(false);
        setQuoteToInvoice(null);
        showToast(`🧾 Cotización ${correlative} FACTURADA exitosamente (Factura N° ${invNum})`);
      };

      // --- GESTIÓN DE COBRANZAS: MARCAR / DESMARCAR PAGO DIRECTO ---
      const handleTogglePaidStatus = (quote) => {
        if (!quote) return;
        const correlative = quote.correlative;
        const willBePaid = !(quote.isPaid === true || quote.paymentStatus === 'Pagada' || quote.invoicePaymentStatus === 'Pagada al Día');
        const todayStr = new Date().toISOString().slice(0, 10);

        if (!willBePaid) {
          const confirmUnpay = window.confirm(`¿Deseas desmarcar el pago de ${correlative} (${quote.client?.name || 'Cliente'}) y dejarla como Pendiente de Pago?`);
          if (!confirmUnpay) return;
        }

        const updatedHistory = quoteHistory.map(q => {
          if (q.correlative === correlative) {
            return {
              ...q,
              isPaid: willBePaid,
              paymentStatus: willBePaid ? 'Pagada' : 'Pendiente',
              paidDate: willBePaid ? (q.paidDate || todayStr) : null,
              invoicePaymentStatus: willBePaid ? 'Pagada al Día' : (q.invoicePaymentStatus === 'Pagada al Día' ? 'Pendiente' : (q.invoicePaymentStatus || 'Pendiente'))
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);

        // Sincronizar con OT si existe
        const updatedOts = workOrders.map(o => {
          if (o.correlative === correlative) {
            return {
              ...o,
              isPaid: willBePaid,
              paidDate: willBePaid ? (o.paidDate || todayStr) : null
            };
          }
          return o;
        });
        saveWorkOrdersList(updatedOts);

        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
          if (window.db) {
            window.db.collection('quotes').doc(correlative).set({
              isPaid: willBePaid,
              paymentStatus: willBePaid ? 'Pagada' : 'Pendiente',
              paidDate: willBePaid ? todayStr : null,
              invoicePaymentStatus: willBePaid ? 'Pagada al Día' : 'Pendiente'
            }, { merge: true });
          }
        } catch(err) { console.warn('Error guardando pago en Firebase:', err); }

        if (willBePaid) {
          showToast(`💵 ¡Excelente! Cotización ${correlative} marcada como PAGADA.`);
        } else {
          showToast(`↩️ Cotización ${correlative} devuelta a Pendiente de Pago.`);
        }
      };

      // --- CONTROL DIRECTO DE ESTADOS DESDE ADMINISTRACIÓN (TALLER / LISTO / EMITIDA / FACTURADA / PAGADA) ---
      const handleUpdateQuoteStatusDirect = (quote, newStatus) => {
        if (!quote) return;
        const targetCorr = normCorr(quote.correlative || quote._fireId);
        const todayStr = new Date().toISOString().slice(0, 10);
        
        let willBePaid = quote.isPaid;
        if (newStatus === 'Pagada') willBePaid = true;
        if (newStatus === 'Emitida' || newStatus === 'Taller') willBePaid = false;

        let statusText = newStatus;
        if (newStatus === 'Taller') statusText = 'Aprobada';
        if (newStatus === 'Terminada') statusText = 'Terminada';
        if (newStatus === 'Facturada') statusText = 'Facturada';
        if (newStatus === 'Emitida') statusText = 'Emitida';

        const updatedHistory = quoteHistory.map(q => {
          if (normCorr(q.correlative || q._fireId) === targetCorr) {
            return {
              ...q,
              status: statusText,
              isPaid: willBePaid,
              paymentStatus: willBePaid ? 'Pagada' : (q.paymentStatus || 'Pendiente'),
              paidDate: willBePaid ? (q.paidDate || todayStr) : (newStatus === 'Emitida' ? null : q.paidDate),
              hasOt: (newStatus === 'Taller' || newStatus === 'Terminada' || q.hasOt) ? true : q.hasOt
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);

        // Si la OT no existe y se pasa a Taller, construirla
        let currentOts = [...workOrders];
        let existingOt = currentOts.find(o => normCorr(o.correlative || o._fireId) === targetCorr);
        if (newStatus === 'Taller' || newStatus === 'Terminada') {
          if (!existingOt) {
            const built = getOrBuildOtForQuote(quote);
            if (built) {
              existingOt = { ...built, status: newStatus === 'Terminada' ? 'completado' : 'en_proceso' };
              currentOts.push(existingOt);
            }
          } else {
            currentOts = currentOts.map(o => {
              if (normCorr(o.correlative || o._fireId) === targetCorr) {
                return {
                  ...o,
                  status: newStatus === 'Terminada' ? 'completado' : 'en_proceso',
                  isPaid: willBePaid
                };
              }
              return o;
            });
          }
          saveWorkOrdersList(currentOts);
        }

        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
          if (window.db) {
            window.db.collection('quotes').doc(quote.correlative || quote._fireId).set({
              status: statusText,
              isPaid: willBePaid,
              paymentStatus: willBePaid ? 'Pagada' : 'Pendiente',
              hasOt: (newStatus === 'Taller' || newStatus === 'Terminada' || quote.hasOt) ? true : quote.hasOt
            }, { merge: true });
          }
          const sheetsUrl = localStorage.getItem('olivar_sheets_url') || DEFAULT_SHEETS_URL;
          if (sheetsUrl) {
            fetch(sheetsUrl, {
              method: 'POST',
              body: JSON.stringify({ action: 'updateStatus', correlative: quote.correlative, status: statusText })
            }).catch(() => {});
          }
        } catch (err) {
          console.warn('Error guardando cambio de estado:', err);
        }

        const labels = {
          'Taller': '🔴 EN TALLER',
          'Terminada': '🟢 LISTO / TERMINADO EN TALLER',
          'Emitida': '⚪ EMITIDA',
          'Facturada': '🔵 FACTURADA',
          'Pagada': '💵 PAGADA',
          'Cancelada': '🚫 CANCELADA'
        };
        showToast(`Estado de ${quote.correlative} actualizado a: ${labels[newStatus] || newStatus}`);
      };

      // === PIPELINE DE ESTADOS SECUENCIALES (1 AL 6) ===
      const PIPELINE_STAGES = [
        { id: 'cotizado', num: 1, label: 'Cotizado', short: '1. Cotizado' },
        { id: 'confirmado', num: 2, label: 'Confirmado', short: '2. Confirmado' },
        { id: 'taller', num: 3, label: 'En Taller', short: '3. Taller 🔴' },
        { id: 'listo', num: 4, label: 'Listo', short: '4. Listo 🟢' },
        { id: 'facturado', num: 5, label: 'Facturar', short: '5. Facturar 🧾' },
        { id: 'entregado', num: 6, label: 'Entregado', short: '6. Entregado 💵' }
      ];

      const getQuotePipelineStage = (q) => {
        if (q.pipelineStage) return q.pipelineStage;
        if (q.isPaid === true || q.paymentStatus === 'Pagada' || q.invoicePaymentStatus === 'Pagada al Día' || q.isDelivered) return 'entregado';
        if (q.status === 'Facturada' || Boolean(q.invoiceNumber)) return 'facturado';
        const ot = getOrBuildOtForQuote(q);
        if (q.status === 'Terminada' || (ot && ot.status === 'completado')) return 'listo';
        if (q.status === 'Aprobada' || (ot && ot.status !== 'completado') || Boolean(q.hasOt) || (q.status && String(q.status).toLowerCase().includes('taller'))) return 'taller';
        if (Boolean(q.purchaseOrderNumber) || q.status === 'Confirmada') return 'confirmado';
        return 'cotizado';
      };

      const handleSetPipelineStage = (quote, stageId) => {
        if (!quote) return;
        const targetCorr = normCorr(quote.correlative || quote._fireId);
        const todayStr = new Date().toISOString().slice(0, 10);

        let statusText = 'Emitida';
        let isPaid = false;
        let isDelivered = quote.isDelivered || false;

        if (stageId === 'cotizado') {
          statusText = 'Emitida';
          isPaid = false;
        } else if (stageId === 'confirmado') {
          statusText = 'Confirmada';
          isPaid = false;
        } else if (stageId === 'taller') {
          statusText = 'Aprobada';
          isPaid = false;
        } else if (stageId === 'listo') {
          statusText = 'Terminada';
          isPaid = false;
        } else if (stageId === 'facturado') {
          statusText = 'Facturada';
          isPaid = false;
        } else if (stageId === 'entregado') {
          statusText = 'Pagada';
          isPaid = true;
          isDelivered = true;
        }

        const updatedHistory = quoteHistory.map(q => {
          if (normCorr(q.correlative || q._fireId) === targetCorr) {
            return {
              ...q,
              pipelineStage: stageId,
              status: statusText,
              isPaid: isPaid,
              paymentStatus: isPaid ? 'Pagada' : (q.paymentStatus || 'Pendiente'),
              paidDate: isPaid ? (q.paidDate || todayStr) : null,
              isDelivered: isDelivered,
              deliveredAt: isDelivered ? (q.deliveredAt || todayStr) : q.deliveredAt,
              hasOt: (stageId === 'taller' || stageId === 'listo' || q.hasOt) ? true : q.hasOt
            };
          }
          return q;
        });
        setQuoteHistory(updatedHistory);

        // Sincronizar OT si aplica
        let currentOts = [...workOrders];
        let existingOt = currentOts.find(o => normCorr(o.correlative || o._fireId) === targetCorr);
        if (stageId === 'taller' || stageId === 'listo') {
          if (!existingOt) {
            const built = getOrBuildOtForQuote(quote);
            if (built) {
              existingOt = { ...built, status: stageId === 'listo' ? 'completado' : 'en_proceso' };
              currentOts.push(existingOt);
            }
          } else {
            currentOts = currentOts.map(o => {
              if (normCorr(o.correlative || o._fireId) === targetCorr) {
                return {
                  ...o,
                  status: stageId === 'listo' ? 'completado' : 'en_proceso',
                  isPaid: isPaid
                };
              }
              return o;
            });
          }
          saveWorkOrdersList(currentOts);
        }

        try {
          localStorage.setItem('olivar_quotes_history', JSON.stringify(updatedHistory));
          if (window.db) {
            window.db.collection('quotes').doc(quote.correlative || quote._fireId).set({
              pipelineStage: stageId,
              status: statusText,
              isPaid: isPaid,
              paymentStatus: isPaid ? 'Pagada' : 'Pendiente',
              hasOt: (stageId === 'taller' || stageId === 'listo' || quote.hasOt) ? true : quote.hasOt
            }, { merge: true });
          }
        } catch(e) {}

        const stageNames = {
          cotizado: '1. Cotizado',
          confirmado: '2. Confirmado por Cliente',
          taller: '3. En Taller 🔴',
          listo: '4. Listo en Taller 🟢',
          facturado: '5. Facturar 🧾',
          entregado: '6. Entregado / Pagado 💵'
        };
        showToast(`Cotización ${quote.correlative} movida a: ${stageNames[stageId] || stageId}`);
      };

      // === DETECCIÓN Y RESOLUCIÓN INTELIGENTE DE COTIZACIONES DUPLICADAS ===
      const duplicateQuotesInfo = useMemo(() => {
        const map = new Map(); // correlative -> originalQuote
        const signatures = new Map(); // signature -> firstQuote

        // Ordenar de la más antigua a la más nueva para conservar siempre la primera emitida
        const sorted = [...quoteHistory].sort((a, b) => {
          const numA = a.numericCorrelative || parseInt((a.correlative || '').replace(/\D/g, ''), 10) || 0;
          const numB = b.numericCorrelative || parseInt((b.correlative || '').replace(/\D/g, ''), 10) || 0;
          return numA - numB;
        });

        sorted.forEach(q => {
          const clientName = (q.client?.name || '').trim().toLowerCase();
          const total = Math.round(q.totals?.total || 0);
          const firstItem = ((q.items && q.items[0] && q.items[0].name) || '').trim().toLowerCase();
          const itemsCount = (q.items || []).length;
          
          if (clientName && total > 0) {
            // Mismo cliente + mismo total + misma cantidad de ítems + mismo primer ítem
            const sig = `${clientName}__${total}__${itemsCount}__${firstItem}`;
            if (signatures.has(sig)) {
              const original = signatures.get(sig);
              if (original.correlative !== q.correlative) {
                map.set(q.correlative, original);
              }
            } else {
              signatures.set(sig, q);
            }
          }
        });

        return map;
      }, [quoteHistory]);

      const handleResolveDuplicates = () => {
        if (duplicateQuotesInfo.size === 0) {
          showToast('ℹ️ No se detectan cotizaciones duplicadas en el historial.');
          return;
        }

        const dupEntries = Array.from(duplicateQuotesInfo.entries());
        const sumDups = dupEntries.reduce((sum, [corr, orig]) => {
          const q = quoteHistory.find(item => item.correlative === corr);
          return sum + (q?.totals?.total || 0);
        }, 0);

        const confirmMsg = `Se detectaron ${dupEntries.length} cotizaciones duplicadas en el historial (Monto inflado: ${formatCLP(sumDups)}):\n\n` +
          dupEntries.map(([dupCorr, orig]) => `• ${dupCorr} (copia idéntica de ${orig.correlative} - ${orig.client?.name} - ${formatCLP(orig.totals?.total)})`).join('\n') +
          `\n\n¿Deseas eliminarlas y dejar únicamente las cotizaciones originales?`;

        if (!window.confirm(confirmMsg)) return;

        const dupCorrelatives = dupEntries.map(([c]) => c);
        const dupQuotes = quoteHistory.filter(q => dupCorrelatives.includes(q.correlative));
        permanentlyPurgeQuotes(dupQuotes.length > 0 ? dupQuotes : dupCorrelatives);

        showToast(`✅ Se eliminaron ${dupEntries.length} duplicados. El historial ahora refleja exactamente los montos reales.`);
      };

      const handleDeleteSingleDuplicate = (correlative) => {
        const orig = duplicateQuotesInfo.get(correlative);
        const confirmMsg = `¿Eliminar la cotización duplicada ${correlative}${orig ? ` (copia de ${orig.correlative})` : ''}?`;
        if (!window.confirm(confirmMsg)) return;

        const targetQuote = quoteHistory.find(q => q.correlative === correlative);
        permanentlyPurgeQuotes(targetQuote || correlative);

        showToast(`✅ Cotización duplicada ${correlative} eliminada permanentemente.`);
      };

      // Rescatador / Generador inteligente de OT para supervisión administrativa y taller
      const getOrBuildOtForQuote = (quote) => {
        if (!quote) return null;
        const corrStr = String(quote.correlative || '').trim().toUpperCase();
        if (!corrStr) return null;
        const cleanCorr = corrStr.replace('COT-', '');
        let ot = workOrders.find(o => {
          const oCorr = String(o.correlative || '').trim().toUpperCase();
          const oFolio = String(o.otFolio || '').trim().toUpperCase();
          return (oCorr && oCorr === corrStr) || (oFolio && cleanCorr && oFolio.includes(cleanCorr));
        });
        if (ot) {
          // Sincronizar siempre los ítems e insumos extraídos estrictos según los ítems reales de la cotización
          if (!ot.items || ot.items.length === 0) {
            ot.items = quote.items || [];
          }
          const itemsSource = (ot.items && ot.items.length > 0) ? ot.items : (quote.items || []);
          ot.materials = generateMaterialsList(itemsSource, ot.client?.deliveryMethod || quote.client?.deliveryMethod);
        } else {
          // Generar siempre la OT para cualquier cotización para visualización y ficha técnica
          const otFolio = 'OT-' + cleanCorr;
          const generatedMaterials = generateMaterialsList(quote.items || [], quote.client?.deliveryMethod);
          ot = {
            id: `ot-${corrStr}`,
            otFolio,
            correlative: corrStr,
            numericFolio: quote.numericCorrelative || parseInt(corrStr.replace(/\D/g, ''), 10) || 1,
            createdAt: quote.date || new Date().toLocaleDateString('es-CL'),
            createdTimestamp: quote.timestamp || (Date.now() - 86400000 * 2),
            deadline: quote.deadline || quote.client?.manufacturingDays || '5 a 7 días hábiles',
            status: (quote.status === 'Terminada' || quote.status === 'Facturada') ? 'completado' : ((quote.status === 'Aprobada' || quote.status === 'Taller') ? 'fabricacion' : 'por_iniciar'),
            client: { ...(quote.client || {}) },
            items: quote.items || [],
            materials: generatedMaterials,
            assignedTech: 'Taller Matriz (Olivar)',
            priority: 'Normal',
            purchaseOrderNumber: quote.purchaseOrderNumber || '',
            notes: quote.workshopNotes || quote.adminNotes || quote.invoiceNotes || '',
            images: quote.referenceImages || quote.images || []
          };
        }
        return ot;
      };

      // Catálogo consolidado de Órdenes de Trabajo (registradas en taller + cotizaciones en fabricación)
      const allWorkshopOrders = useMemo(() => {
        const orderMap = new Map();
        (workOrders || []).forEach(o => {
          if (!o) return;
          const key = String(o.correlative || o.otFolio || o.id || '').trim().toUpperCase();
          if (key) orderMap.set(key, o);
        });
        (quoteHistory || []).forEach(q => {
          if (!q) return;
          const corr = String(q.correlative || '').trim().toUpperCase();
          const cleanCorr = corr.replace('COT-', '');
          const existingKey = Array.from(orderMap.keys()).find(k => k === corr || (cleanCorr && k.includes(cleanCorr)));
          if (!existingKey) {
            const rescuedOt = getOrBuildOtForQuote(q);
            if (rescuedOt) {
              orderMap.set(corr || rescuedOt.otFolio, rescuedOt);
            }
          }
        });
        return Array.from(orderMap.values());
      }, [workOrders, quoteHistory]);

      // Trabajos terminados en Taller pendientes de Facturar (Alerta persistente para Administración y Secretaría)
      const quotesReadyToInvoice = useMemo(() => {
        return (quoteHistory || []).filter(q => {
          if (!q) return false;
          if (q.isPaid || q.paymentStatus === 'Pagada' || q.invoicePaymentStatus === 'Pagada al Día' || q.status === 'Pagada' || String(q.status || '').toLowerCase() === 'pagada') return false;
          if (q.status === 'Facturada' || Boolean(q.invoiceNumber)) return false;
          const ot = getOrBuildOtForQuote(q);
          const s = String(q.status || '').toLowerCase();
          return s === 'terminada' || (ot && ot.status === 'completado');
        });
      }, [quoteHistory, allWorkshopOrders]);

      // Trabajos nuevos enviados por Administración a Taller pendientes de iniciar fabricación (Semáforo de Alerta para Taller)
      const workshopNewOrders = useMemo(() => {
        return (allWorkshopOrders || []).filter(o => {
          if (!o) return false;
          return o.status === 'por_iniciar';
        });
      }, [allWorkshopOrders]);

      // === GESTIÓN DE DESPACHOS & ENTREGAS A CLIENTES ===
      const pendingDeliveries = useMemo(() => {
        const deliveredKeys = new Set();
        (deliveriesList || []).forEach(d => {

          if (ot.status === 'completado' && !isDelivered) {

                raw: q

      // Cálculo de días en taller desde pase a producción
      const getOtDaysInWorkshop = (ot) => {
        if (!ot) return 0;
        let timestamp = ot.createdTimestamp;
        if (!timestamp && ot.createdAt) {
          const parts = String(ot.createdAt).split(/[-/]/);
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              timestamp = new Date(parts[0], parts[1] - 1, parts[2]).getTime();
            } else {
              timestamp = new Date(parts[2], parts[1] - 1, parts[0]).getTime();
            }
          }
        }
        if (!timestamp || isNaN(timestamp)) {
          timestamp = Date.now() - (86400000 * 2);
        }
        const diffMs = Date.now() - timestamp;
        return Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
      };

          const match = String(ot.deadline).match(/(\d+)/);
          if (match) {
            maxDaysAllowed = parseInt(match[1], 10);
          }
        }

        if (days > maxDaysAllowed) {
          const daysDelayed = days - maxDaysAllowed;
          return {
            status: 'retrasada',
            isDelayed: true,
            daysDelayed,
            label: `🚨 Retrasada (+${daysDelayed}d)`,
            badgeClass: 'bg-rose-950/60 text-rose-300 border-rose-500/50 animate-pulse'

                          {/* Subtotal en vivo con desglose */}

                            const h = parseFloat(itemHeight) || 0;

                            const pr = parseFloat(itemPrice) || 0;
                            const hasDimensions = w > 0 && h > 0;
                            const isSqm = hasDimensions && (priceMode === 'sqm');
                            const area = hasDimensions ? (w * h) : 1;
                            const base = isSqm ? (w * h * qty * pr) : (qty * pr);

                            let compositionSum = 0;
                            Object.keys(compositionLayers).forEach(k => {
                              const s = compositionLayers[k];
                              if (s.active) {
                                const sp = parseFloat(s.price) || 0;
                                compositionSum += (s.perSqm && isSqm ? (sp * area * qty) : (sp * qty));
                              }

                            Object.keys(finishesState).forEach(k => {
                              const f = finishesState[k];

                                finishesSum += (f.perSqm && isSqm ? (fp * area * qty) : (fp * qty));
                              }
                            });

                            const rawPreview = Math.round(base + compositionSum + finishesSum);
                            const unitPiecePreview = qty > 0 ? Math.round(rawPreview / qty) : rawPreview;
                            const totalPreview = qty > 0 ? (unitPiecePreview * qty) : rawPreview;

                                    {compositionSum > 0 && <div className="text-amber-400">+ Composición de Capas: {formatCLP(compositionSum)}</div>}
                                    {finishesSum > 0 && <div className="text-emerald-400">+ Acabados: {formatCLP(finishesSum)}</div>}
                                  </div>
                                </div>
                                <div className="text-right">
                                  <span className="text-2xl font-black text-red-500 font-mono block">
                                    {formatCLP(totalPreview)}
                                  </span>
                                  <div className="text-xs font-mono font-bold text-emerald-400 mt-0.5">

                                    {hasDimensions ? `(${w}m × ${h}m | ${(w * h * qty).toFixed(2)} m² totales)` : `${qty} unidad(es)`}
                                  </span>
                                </div>
                              </div>
                            );
                          })()}

                {/* SUB-PESTAÑA 2: SOLICITUDES ENTRANTES DE CLIENTES */}
                {intranetTab === 'solicitudes' && (

                {/* SUB-PESTAÑA 3: HISTORIAL DE COTIZACIONES EMITIDAS & CONTROL DE COBRANZAS */}
                {intranetTab === 'historial' && (() => {
                  const isQuotePaid = (q) => {
                    if (!q) return false;
                    return q.isPaid === true ||
                           q.paymentStatus === 'Pagada' ||
                           q.invoicePaymentStatus === 'Pagada al Día' ||
                           q.status === 'Pagada' ||
                           String(q.status || '').toLowerCase() === 'pagada';
                  };

                  const isQuoteInvoiced = (q) => {
                    if (isQuotePaid(q)) return false;
                    return q.status === 'Facturada' || Boolean(q.invoiceNumber);
                  };

                  const getQuoteOt = (q) => {
                    return getOrBuildOtForQuote(q);
                  };

                  // 2. En Fabricación / Taller: tiene OT en taller que no ha finalizado (no completada)
                  const isQuoteInWorkshop = (q) => {
                    if (isQuoteInvoiced(q) || isQuotePaid(q)) return false;
                    const ot = getQuoteOt(q);
                    if (ot) {
                      return ot.status !== 'completado';
                    }
                    const s = String(q.status || '').toLowerCase();
                    return s === 'aprobada' || s.includes('fabricaci') || s.includes('taller') || Boolean(q.purchaseOrderNumber) || Boolean(q.hasOt);
                  };

                  // 3. Por Facturar: terminada en taller (OT completada o q.status === 'Terminada') pero aún no facturada
                  const isQuoteReadyToInvoice = (q) => {
                    if (isQuoteInvoiced(q) || isQuotePaid(q)) return false;
                    const ot = getQuoteOt(q);
                    const s = String(q.status || '').toLowerCase();
                    return s === 'terminada' || (ot && ot.status === 'completado');
                  };

                  // Helpers de Vigencia, Expiración y Cancelación
                  const isQuoteConfirmed = (q) => {
                    const s = String(q.status || '').toLowerCase();
                    return s === 'aprobada' || s === 'facturada' || s === 'terminada' || isQuoteInWorkshop(q) || isQuoteReadyToInvoice(q) || isQuoteInvoiced(q) || Boolean(q.purchaseOrderNumber) || Boolean(q.hasOt);
                  };

                  const isQuoteCancelled = (q) => {
                    const s = String(q.status || '').toLowerCase();
                    return s === 'cancelada';
                  };

                  const getQuoteExpiration = (q) => {
                    const validDays = Number(q.client?.validDays) || 15;
                    let ts = q.timestamp;
                    if (!ts && q.date) {
                      const p = String(q.date).split(/[-/]/);
                      if (p.length === 3) {
                        ts = p[0].length === 4 ? new Date(p[0] + '-' + p[1] + '-' + p[2]).getTime() : new Date(p[2] + '-' + p[1] + '-' + p[0]).getTime();
                      }
                    }
                    if (!ts) ts = Date.now();
                    const maxAge = validDays * 24 * 60 * 60 * 1000;
                    const elapsed = Date.now() - ts;
                    const isExpired = elapsed > maxAge && !isQuoteConfirmed(q) && !isQuoteCancelled(q);
                    const remainingDays = Math.ceil((maxAge - elapsed) / (24 * 60 * 60 * 1000));
                    const daysExpired = Math.floor((elapsed - maxAge) / (24 * 60 * 60 * 1000));
                    return { validDays, isExpired, remainingDays, daysExpired };
                  };

                  const isQuoteExpired = (q) => {
                    if (isQuotePaid(q) || isQuoteInvoiced(q)) return false;
                    return getQuoteExpiration(q).isExpired;
                  };

                  // 1. Nuevas Emitidas: vigentes en espera de decisión del cliente (excluye taller, por facturar, facturadas, pagadas, vencidas y canceladas)
                  const isQuoteOnlyIssued = (q) => {
                    if (isQuoteInvoiced(q) || isQuotePaid(q)) return false;
                    if (isQuoteInWorkshop(q) || isQuoteReadyToInvoice(q)) return false;
                    if (isQuoteCancelled(q) || isQuoteExpired(q)) return false;
                    const s = String(q.status || '').toLowerCase();
                    return s !== 'aprobada' && s !== 'terminada' && !s.includes('fabricaci') && !s.includes('taller') && !q.purchaseOrderNumber && !q.hasOt;
                  };

                  // 4. Facturadas pendientes de cobro (Cobranza activa)
                  const isQuoteInvoicedPending = (q) => {
                    return isQuoteInvoiced(q) && !isQuotePaid(q);
                  };

                  // 5. Activas en Proceso: solo las que están en curso técnico o listas por facturar (excluye pagadas, facturadas, vencidas y canceladas)
                  const isQuoteActive = (q) => {
                    if (isQuotePaid(q)) return false;
                    if (isQuoteCancelled(q)) return false;
                    if (isQuoteExpired(q)) return false;
                    if (isQuoteInvoiced(q)) return false;
                    return true;
                  };

                  const countTodas = quoteHistory.length;
                  const countActivas = quoteHistory.filter(isQuoteActive).length;
                  const countEmitidas = quoteHistory.filter(isQuoteOnlyIssued).length;
                  const countVencidas = quoteHistory.filter(isQuoteExpired).length;
                  const countCanceladas = quoteHistory.filter(isQuoteCancelled).length;
                  const countTaller = quoteHistory.filter(isQuoteInWorkshop).length;
                  const countPorFacturar = quoteHistory.filter(isQuoteReadyToInvoice).length;
                  const countFacturadas = quoteHistory.filter(isQuoteInvoiced).length;
                  const countFacturasPendientes = quoteHistory.filter(isQuoteInvoicedPending).length;
                  const countPagadas = quoteHistory.filter(isQuotePaid).length;

                  // Conteos por Etapa de Pipeline
                  const countStageCotizado = quoteHistory.filter(q => getQuotePipelineStage(q) === 'cotizado').length;
                  const countStageConfirmado = quoteHistory.filter(q => getQuotePipelineStage(q) === 'confirmado').length;
                  const countStageTaller = quoteHistory.filter(q => getQuotePipelineStage(q) === 'taller').length;
                  const countStageListo = quoteHistory.filter(q => getQuotePipelineStage(q) === 'listo').length;
                  const countStageFacturado = quoteHistory.filter(q => getQuotePipelineStage(q) === 'facturado').length;
                  const countStageEntregado = quoteHistory.filter(q => getQuotePipelineStage(q) === 'entregado').length;

                  // Facturas emitidas oficialmente (SII)
                  const invoicedQuotes = quoteHistory.filter(isQuoteInvoiced);
                  const totalFacturasPorCobrar = quoteHistory.filter(isQuoteInvoicedPending).reduce((sum, q) => sum + (parseFloat(q.totals?.total) || 0), 0);
                  const facturasPagadas = quoteHistory.filter(isQuotePaid);
                  const totalFacturasPagadas = facturasPagadas.reduce((sum, q) => sum + (parseFloat(q.totals?.total) || 0), 0);

                  const filteredQuotes = quoteHistory.filter(q => {
                    if (historyStatusFilter === 'todas') {
                      // Se muestran todas las cotizaciones sin ocultar nada
                    } else if (historyStatusFilter === 'emitidas' || historyStatusFilter === 'stage_cotizado') {
                      if (!isQuoteOnlyIssued(q)) return false;
                    } else if (historyStatusFilter === 'taller' || historyStatusFilter === 'stage_taller') {
                      if (!isQuoteInWorkshop(q)) return false;
                    } else if (historyStatusFilter === 'listo' || historyStatusFilter === 'stage_listo' || historyStatusFilter === 'por_facturar') {
                      if (!isQuoteReadyToInvoice(q) && q.status !== 'Terminada') return false;
                    } else if (historyStatusFilter === 'facturadas' || historyStatusFilter === 'stage_facturado') {
                      if (!isQuoteInvoiced(q)) return false;
                    } else if (historyStatusFilter === 'pagadas' || historyStatusFilter === 'stage_entregado') {
                      if (!isQuotePaid(q)) return false;
                    } else if (historyStatusFilter === 'canceladas') {
                      if (!isQuoteCancelled(q)) return false;

                                              </td>

                                        onChange={(e) => handleUpdateQuoteStatusDirect(q, e.target.value)}
                                        className={`text-xs font-black rounded-lg px-2.5 py-1 transition cursor-pointer border shadow-xs outline-none ${

                                          (q.status === 'Terminada' || (getQuoteOt(q) && getQuoteOt(q).status === 'completado')) ? 'bg-emerald-600 text-white border-emerald-700' :

                                      {/* Acciones directas rápidas */}
                                      {!isQuoteInWorkshop(q) && !paid && q.status !== 'Terminada' && q.status !== 'Facturada' && q.status !== 'Cancelada' && (

                                          type="button"

                                          title="Enviar a Taller (en rojo)"

                                          <span>🔴 A Taller</span>
                                        </button>

                                      {isQuoteInWorkshop(q) && (

                                          type="button"

                                      {(q.status === 'Terminada' || (getQuoteOt(q) && getQuoteOt(q).status === 'completado')) && !paid && q.status !== 'Facturada' && (

                                    {q.purchaseOrderNumber && (

                                    onClick={() => handleReuseQuote(q)}

                                  </button>
                                </div>
                              </div>
                            );

                          <button

                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold text-lg">

                        </div>
